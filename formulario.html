<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <link href="styles.css" rel="stylesheet"/>
</head>
<body>
    <div>
        <h1>Formulario de asociación a Ferro</h1>
        <p>Completa con tus datos para unirte a nuestra comunidad</p>

        <form action="#" method="POST" id="registroForm">
            <fieldset>
                <legend>Datos Personales</legend>

                <div>
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Victoria Larango" required>
                </div>

                <div>
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="Ej: victoria@correo.com" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 11 9876-3456">
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>
            </fieldset>

            <fieldset>
                <legend>Deporte</legend>

                <div>
                    <label for="pais">Deporte</label>
                    <select id="pais" name="pais" required>
                        <option value="">Selecciona un deporte...</option>
                        <option value="hanball">Handball</option>
                        <option value="voley">Voley</option>
                        <option value="futbol">Fútbol</option>
                        <option value="hockey">Hockey</option>
                        <option value="gimnasia">Gimnasia</option>
                        <option value="Basquet">Basquet</option>
                        <option value="beisbol">Beisbol</option>
                        <option value="running">Running</option>
                        <option value="natacion">Natación</option>
                        <option value="boxeo">Boxeo</option>
                        <option value="futsal">Futsal</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>

                <div>
                    <label>Días</label>
                    <div>
                        <label>
                            <input type="radio" name="edad" value="edad">
                            Lunes y Miércoles
                        </label>
                        <label>
                            <input type="radio" name="edad" value="edad">
                            Martes y Jueves
                        </label>
                        <label>
                            <input type="radio" name="edad" value="edad">
                            Miércoles y Viernes
                        </label>
                        <label>
                            <input type="radio" name="edad" value="edad">
                            Martes y Sábados
                        </label>
                        <label>
                            <input type="radio" name="edad" value="otro">
                            Domingos
                        </label>
                        
                    </div>
                </div>

                <div>
                    <label>Horarios</label>
                    <div>
                        <label>
                            <input type="checkbox" name="hora" value="hora">
                            De 9:00 a.m. a 11 a.m.
                        </label>
                        <label>
                            <input type="checkbox" name="hora" value="hora">
                            De 11:30 a.m. a 13:30 p.m.
                        </label>
                        <label>
                            <input type="checkbox" name="hora" value="hora">
                            De 15:30 p.m. a 17:30 p.m.
                        </label>
                        <label>
                            <input type="checkbox" name="hora" value="hora">
                            De 18:00 p.m. a 20:00 p.m.
                        </label>
                        <label>
                            <input type="checkbox" name="hora" value="hora">
                            De 20:30 p.m a 22:00 p.m.
                        </label>
                    </div>
                </div>

            </fieldset>

            <fieldset>
                <legend>Asegurá tu cuenta</legend>

                <div>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" minlength="8" required>
                </div>
            </fieldset>

            <fieldset>
            <div>
                    <label for="comentarios">Consultas</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribe tus consultas aquí..."></textarea>
                </div>
            </fieldset>

            <div>
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto el <a href="https://www.ferrocarriloeste.org.ar/club/reglamento-de-disciplina/">Reglamento del club</a> 
                </label>
            </div>

            <div>
                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
    </div>
</body>
</html>
